&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#feishu-card-lab .f-detail-row{display:grid;grid-template-columns:65px minmax(0,1fr);gap:10px}
#feishu-card-lab .f-detail-row&gt;span:first-child{color:var(--f-secondary)}
#feishu-card-lab .f-editor-label{display:block;font-size:12px;color:var(--f-secondary);margin:17px 0 7px}
#feishu-card-lab textarea{display:block;width:100%;resize:vertical;min-height:190px;padding:10px 12px;border:1px solid var(--f-line);border-radius:5px;background:var(--f-surface);color:var(--f-text);font-size:14px;line-height:1.8}
#feishu-card-lab .f-editor-foot{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:12px;color:var(--f-secondary)}
#feishu-card-lab .f-response{margin-top:12px;padding:10px 13px;background:var(--f-surface);border-radius:6px;border:1px solid var(--f-line);white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
#feishu-card-lab .f-file{display:flex;align-items:center;gap:12px}
#feishu-card-lab .f-file-mark{height:36px;width:32px;background:var(--f-blue-soft);color:var(--f-blue-text);display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;flex:0 0 32px}
#feishu-card-lab .f-file-name{color:var(--f-blue-text);font-weight:500}
#feishu-card-lab .f-file small{display:block;color:var(--f-secondary);font-size:12px}
#feishu-card-lab .f-composer{padding:12px 20px 16px;background:var(--f-surface);border-top:1px solid var(--f-line)}
#feishu-card-lab .f-composer-label{display:block;color:var(--f-secondary);font-size:12px;margin-bottom:8px}
#feishu-card-lab .f-compose-row{display:flex;align-items:stretch;gap:10px}
#feishu-card-lab .f-compose-row input{min-width:0;flex:1;padding:9px 10px;border:1px solid var(--f-line);border-radius:5px;color:var(--f-text);background:var(--f-surface)}
#feishu-card-lab .f-compose-row input::placeholder{color:var(--f-secondary)}
#feishu-card-lab .f-send{padding:7px 15px;border:1px solid var(--f-blue);border-radius:5px;flex:0 0 auto}
@media(max-width:520px){#feishu-card-lab .f-stage{padding:10px 0}#feishu-card-lab .f-chat-head{padding:13px 12px}#feishu-card-lab .f-stream{padding:17px 10px 20px}#feishu-card-lab .f-message-row{grid-template-columns:24px minmax(0,1fr);gap:7px}#feishu-card-lab .f-message-avatar{height:24px;width:24px;font-size:11px;border-radius:6px}#feishu-card-lab .f-card-content{padding:14px 12px 12px}#feishu-card-lab .f-card-head{padding:11px 12px}#feishu-card-lab .f-actions{padding:0 12px 13px;gap:7px}#feishu-card-lab .f-action{flex-basis:42%;min-height:40px}#feishu-card-lab .f-composer{padding:12px}#feishu-card-lab .f-scenes{gap:6px}#feishu-card-lab .f-scenes button{padding:7px 10px}#feishu-card-lab .f-detail-row{grid-template-columns:58px minmax(0,1fr);gap:5px}#feishu-card-lab .f-preview-tag{display:none}}
@media(pointer:coarse){#feishu-card-lab button{min-height:44px}#feishu-card-lab input,#feishu-card-lab textarea{font-size:16px}}
@media(prefers-reduced-motion:reduce){#feishu-card-lab button{transition:none}}
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;feishu-card-lab&#x27;);
  const content = root.querySelector(&#x27;.f-card-content&#x27;);
  const actions = root.querySelector(&#x27;.f-actions&#x27;);
  const response = root.querySelector(&#x27;.f-response&#x27;);
  const input = root.querySelector(&#x27;#f-plain-input&#x27;);
  const original = &#x27;已完成：完成客户访谈整理。[R1]\n阻碍：渠道核对发现两条记录缺少渠道字段。[R2]\n下一步：明天补齐字段并复核汇总。[R3]&#x27;;
  const taskBody = &#x27;按 channel 汇总 amount，按 id 去重。\nonline：0.30 元\noffline：12.50 元\n合计：12.80 元\n排除：1 行完全重复、1 行缺失金额。&#x27;;
  const messages = {draft:&#x27;草稿箱&#x27;,task:&#x27;看看渠道汇总的进展&#x27;,mail:&#x27;把这版工作总结发到我邮箱&#x27;,group:&#x27;@登登的飞书 CLI\n按渠道汇总这份 CSV，结果回复本话题。&#x27;};
  const initial = {scene:&#x27;draft&#x27;, lastMessage:messages.draft, version:1, body:original, taskVersion:1, taskBody, confirmed:false, discarded:false, editor:false, taskControl:&#x27;agent&#x27;, mailStatus:&#x27;preview&#x27;};
  let state = {...initial};
  const esc = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, char =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[char]));
  const line = (label,value) =&gt; `&lt;div class=&quot;f-detail-row&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;span&gt;${value}&lt;/span&gt;&lt;/div&gt;`;
  const action = (label,name,primary=false,disabled=false) =&gt; `&lt;button type=&quot;button&quot; class=&quot;f-action cursor-interaction${primary?&#x27; f-primary&#x27;:&#x27;&#x27;}&quot; data-action=&quot;${name}&quot;${disabled?&#x27; disabled&#x27;:&#x27;&#x27;}&gt;${label}&lt;/button&gt;`;
  function saveState(){
    const snapshot = {modelContent:{preview:&#x27;飞书交互卡片&#x27;,scene:state.scene,version:state.version,control:state.taskControl,mailStatus:state.mailStatus},privateContent:{...state}};
    window.openai?.setWidgetState?.(snapshot)?.catch(()=&gt;{});
  }
  function restore(snapshot){
    const prior = snapshot?.privateContent;
    if (prior &amp;&amp; [&#x27;draft&#x27;,&#x27;task&#x27;,&#x27;mail&#x27;,&#x27;group&#x27;].includes(prior.scene)) {
      state = {...initial,...prior};
      if (![&#x27;agent&#x27;,&#x27;paused&#x27;,&#x27;handover&#x27;,&#x27;human&#x27;].includes(state.taskControl)) state.taskControl=&#x27;agent&#x27;;
      if (typeof prior.lastMessage!==&#x27;string&#x27;) state.lastMessage=messages[state.scene];
      if (typeof state.body!==&#x27;string&#x27;) state.body=original;
      if (typeof state.taskBody!==&#x27;string&#x27;) state.taskBody=taskBody;
      state.version=Math.max(1,Number(state.version)||1);
      state.taskVersion=Math.max(1,Number(state.taskVersion)||1);
    }
  }
  function showResponse(text){response.hidden=false;response.textContent=text;}
  function setUser(text){state.lastMessage=text;root.querySelector(&#x27;.f-user-text&#x27;).textContent=text;}
  function reportBody(){
    if(state.body===original) return `&lt;div class=&quot;f-report&quot;&gt;&lt;div&gt;&lt;strong&gt;已完成&lt;/strong&gt;&lt;p&gt;完成客户访谈整理。&lt;span class=&quot;f-ref&quot;&gt;[R1]&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;阻碍&lt;/strong&gt;&lt;p&gt;渠道核对发现两条记录缺少渠道字段。&lt;span class=&quot;f-ref&quot;&gt;[R2]&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;下一步&lt;/strong&gt;&lt;p&gt;明天补齐字段并复核汇总。&lt;span class=&quot;f-ref&quot;&gt;[R3]&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`;
    return `&lt;div class=&quot;f-report&quot; style=&quot;white-space:pre-wrap&quot;&gt;${esc(state.body)}&lt;/div&gt;`;
  }
  function taskState(){
    const labels={agent:&#x27;助手执行&#x27;,paused:&#x27;已暂停&#x27;,handover:&#x27;正在移交&#x27;,human:&#x27;本人已接管&#x27;};
    const cls=state.taskControl===&#x27;human&#x27;?&#x27; f-state-human&#x27;:state.taskControl===&#x27;handover&#x27;?&#x27; f-state-pending&#x27;:state.taskControl===&#x27;paused&#x27;?&#x27; f-state-quiet&#x27;:&#x27;&#x27;;
    return `&lt;span class=&quot;f-state${cls}&quot;&gt;${labels[state.taskControl]}&lt;/span&gt;`;
  }
  function render(){
    root.querySelector(&#x27;.f-user-text&#x27;).textContent=state.lastMessage;
    root.querySelectorAll(&#x27;[data-scene]&#x27;).forEach(button=&gt;button.setAttribute(&#x27;aria-pressed&#x27;,String(button.dataset.scene===state.scene)));
    const group=state.scene===&#x27;group&#x27;;
    root.querySelector(&#x27;.f-chat-title&#x27;).innerHTML=group?&#x27;Harness研究小小组 &lt;span class=&quot;f-bot-label&quot;&gt;群聊&lt;/span&gt;&#x27;:&#x27;登登的飞书 CLI &lt;span class=&quot;f-bot-label&quot;&gt;机器人&lt;/span&gt;&#x27;;
    root.querySelector(&#x27;.f-chat-subtitle&#x27;).textContent=group?&#x27;原消息话题 · 回复留在同一线程&#x27;:&#x27;机器人私聊&#x27;;
    root.querySelector(&#x27;.f-card-title&#x27;).textContent=state.editor?&#x27;编辑产物&#x27;:state.scene===&#x27;mail&#x27;?&#x27;邮件预览&#x27;:&#x27;个人助手&#x27;;
    root.querySelector(&#x27;.f-composer-label&#x27;).textContent=group?&#x27;在原线程 @ 机器人继续操作&#x27;:&#x27;也可以直接发消息，无需点击回复&#x27;;
    input.placeholder=group?&#x27;试试：@登登的飞书 CLI 暂停这个任务&#x27;:state.scene===&#x27;mail&#x27;?&#x27;试试：确认发送、取消发送&#x27;:state.scene===&#x27;task&#x27;?&#x27;试试：暂停这个任务、接管、导出&#x27;:&#x27;试试：编辑这份草稿、导出…&#x27;;
    if (state.editor) {
      const body=state.scene===&#x27;draft&#x27;?state.body:state.taskBody,version=state.scene===&#x27;draft&#x27;?state.version:state.taskVersion;
      content.innerHTML=`&lt;div class=&quot;f-item-title&quot;&gt;${state.scene===&#x27;draft&#x27;?&#x27;今日工作总结&#x27;:&#x27;渠道数据汇总&#x27;}&lt;/div&gt;&lt;div class=&quot;f-meta&quot;&gt;基于 v${version} · 保存后创建新版本，保留旧版&lt;/div&gt;&lt;label class=&quot;f-editor-label&quot; for=&quot;f-edit-body&quot;&gt;新版正文&lt;/label&gt;&lt;textarea id=&quot;f-edit-body&quot; rows=&quot;8&quot; maxlength=&quot;1000&quot;&gt;${esc(body)}&lt;/textarea&gt;&lt;div class=&quot;f-editor-foot&quot;&gt;&lt;span&gt;直接在这里修改即可&lt;/span&gt;&lt;span class=&quot;f-char-count&quot;&gt;${body.length} / 1000&lt;/span&gt;&lt;/div&gt;`;
      actions.innerHTML=action(&#x27;保存新版本&#x27;,&#x27;save&#x27;,true)+action(&#x27;返回查看&#x27;,&#x27;back&#x27;);
      return;
    }
    if(state.scene===&#x27;draft&#x27;) {
      if(state.discarded){content.innerHTML=&#x27;&lt;div class=&quot;f-item-title&quot;&gt;已忽略这份草稿&lt;/div&gt;&lt;div class=&quot;f-meta&quot;&gt;未向群聊或邮箱发送&lt;/div&gt;&#x27;;actions.innerHTML=action(&#x27;查看预览草稿&#x27;,&#x27;restore-draft&#x27;,true);return;}
      content.innerHTML=`&lt;div class=&quot;f-item-title&quot;&gt;今日工作总结&lt;/div&gt;&lt;div class=&quot;f-meta&quot;&gt;&lt;span&gt;草稿 v${state.version} · ${state.version&gt;1?&#x27;本人编辑&#x27;:&#x27;助手生成&#x27;}&lt;/span&gt;&lt;span class=&quot;f-state${state.confirmed?&#x27; f-state-human&#x27;:&#x27; f-state-quiet&#x27;}&quot;&gt;${state.confirmed?&#x27;已确认&#x27;:&#x27;待查看&#x27;}&lt;/span&gt;&lt;/div&gt;${reportBody()}&lt;div class=&quot;f-source&quot;&gt;来自 Harness研究小小组 · 本人提供的 3 条记录&lt;br&gt;仅在草稿箱保留，确认不会自动发布或发邮件。&lt;/div&gt;`;
      actions.innerHTML=action(state.confirmed?&#x27;已确认&#x27;:&#x27;确认草稿&#x27;,&#x27;confirm-draft&#x27;,!state.confirmed,state.confirmed)+action(&#x27;编辑草稿&#x27;,&#x27;edit&#x27;)+action(&#x27;忽略&#x27;,&#x27;discard&#x27;)+action(&#x27;导出&#x27;,&#x27;export&#x27;);
    } else if(state.scene===&#x27;task&#x27;||group) {
      content.innerHTML=`&lt;div class=&quot;f-item-title&quot;&gt;渠道数据汇总&lt;/div&gt;&lt;div class=&quot;f-meta&quot;&gt;${taskState()}&lt;span&gt;结果 v${state.taskVersion} 已保存&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;f-detail&quot;&gt;${line(&#x27;进展&#x27;,state.taskControl===&#x27;handover&#x27;?&#x27;正在等待在途操作结束，尚未完成接管。&#x27;:state.taskControl===&#x27;human&#x27;?&#x27;控制权已交给你，可以编辑产物。&#x27;:state.taskControl===&#x27;paused&#x27;?&#x27;已保存进度，等待你的继续指令。&#x27;:&#x27;已完成初次汇总，正在按新要求复核口径。&#x27;)}${line(&#x27;来源&#x27;,&#x27;本话题提供的虚构 CSV，共 5 行&#x27;)}${!group?line(&#x27;最近结果&#x27;,state.taskVersion===1?&#x27;online 0.30 元 · offline 12.50 元&lt;br&gt;合计 12.80 元&#x27;:`本人编辑的 v${state.taskVersion}，可查看产物全文`):&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;f-source&quot;&gt;${group?&#x27;正文和文件通过机器人私聊查看；本话题保留进度与控制。&#x27;:&#x27;普通查看不会暂停任务；接管完成后再编辑。&#x27;}&lt;/div&gt;`;
      actions.innerHTML=action(&#x27;刷新状态&#x27;,&#x27;refresh&#x27;,true);
      if(!group) actions.innerHTML+=action(&#x27;查看产物&#x27;,&#x27;artifact&#x27;);
      if(state.taskControl===&#x27;agent&#x27;) actions.innerHTML+=action(&#x27;暂停&#x27;,&#x27;pause&#x27;)+action(&#x27;接管&#x27;,&#x27;takeover&#x27;);
      if(state.taskControl===&#x27;paused&#x27;) actions.innerHTML+=action(&#x27;继续&#x27;,&#x27;resume&#x27;);
      if(state.taskControl===&#x27;human&#x27;) actions.innerHTML+=(!group?action(&#x27;编辑产物&#x27;,&#x27;edit&#x27;):&#x27;&#x27;)+action(&#x27;交还助手&#x27;,&#x27;return&#x27;);
      if(state.taskControl===&#x27;handover&#x27;) actions.innerHTML+=action(&#x27;移交中…&#x27;,&#x27;takeover&#x27;,false,true);
      if(!group) actions.innerHTML+=action(&#x27;导出&#x27;,&#x27;export&#x27;);
    } else {
      const finished=state.mailStatus===&#x27;submitted&#x27;,cancelled=state.mailStatus===&#x27;cancelled&#x27;;
      content.innerHTML=`&lt;div class=&quot;f-item-title&quot;&gt;${finished?&#x27;邮件已提交&#x27;:cancelled?&#x27;已取消本次发送&#x27;:&#x27;发送今日工作总结&#x27;}&lt;/div&gt;&lt;div class=&quot;f-meta&quot;&gt;${finished?&#x27;邮箱服务器已接收&#x27;:cancelled?&#x27;没有发送邮件&#x27;:&#x27;待你确认 · 尚未发送&#x27;}&lt;/div&gt;&lt;div class=&quot;f-detail&quot;&gt;${line(&#x27;收件人&#x27;,&#x27;yourname@163.com &lt;span class=&quot;f-ref&quot;&gt;（演示地址）&lt;/span&gt;&#x27;)}${line(&#x27;主题&#x27;,&#x27;今日工作总结 · 11 月 3 日&#x27;)}${line(&#x27;产物&#x27;,&#x27;已完成任务的报告正文 · v2&#x27;)}${line(&#x27;正文&#x27;,&#x27;已完成：完成客户访谈整理。[R1]&lt;br&gt;阻碍：两条记录缺少渠道字段。[R2]&lt;br&gt;下一步：补齐字段并复核汇总。[R3]&#x27;)}&lt;/div&gt;&lt;div class=&quot;f-source&quot;&gt;${finished?&#x27;结果不明时先核查记录，避免重复发送。&#x27;:cancelled?&#x27;如需发送，请重新打开邮件预览。&#x27;:&#x27;本次只发送这版正文给本人；改稿后须重新预览确认。&#x27;}&lt;/div&gt;`;
      actions.innerHTML=finished?action(&#x27;查看本次记录&#x27;,&#x27;mail-record&#x27;):cancelled?action(&#x27;重新预览&#x27;,&#x27;mail-preview&#x27;,true):action(&#x27;确认发送这版&#x27;,&#x27;send-mail&#x27;,true)+action(&#x27;取消发送&#x27;,&#x27;cancel-mail&#x27;);
    }
  }
  function exportFile(){
    if(state.scene===&#x27;group&#x27;){showResponse(&#x27;请私聊机器人查看并导出产物。&#x27;);return;}
    const version=state.scene===&#x27;draft&#x27;?state.version:state.taskVersion;
    response.hidden=false;
    response.innerHTML=`&lt;div class=&quot;f-file&quot;&gt;&lt;span class=&quot;f-file-mark&quot; aria-hidden=&quot;true&quot;&gt;TXT&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;f-file-name&quot;&gt;result.txt&lt;/span&gt;&lt;small&gt;v${version} · 私聊文件交付预览&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;`;
  }
  function operate(name){
    if(state.scene===&#x27;group&#x27;&amp;&amp;[&#x27;edit&#x27;,&#x27;save&#x27;,&#x27;artifact&#x27;,&#x27;export&#x27;].includes(name)){showResponse(&#x27;请私聊机器人查看、编辑或导出产物。&#x27;);return;}
    if([&#x27;confirm-draft&#x27;,&#x27;discard&#x27;,&#x27;restore-draft&#x27;].includes(name)&amp;&amp;state.scene!==&#x27;draft&#x27;){showResponse(&#x27;请先打开草稿箱，选择这份草稿。&#x27;);return;}
    if(name===&#x27;confirm-draft&#x27;){state.confirmed=true;showResponse(`已确认 v${state.version}。没有向群或邮箱发送。`);}
    else if(name===&#x27;edit&#x27;){
      if(state.scene!==&#x27;draft&#x27;&amp;&amp;state.taskControl!==&#x27;human&#x27;){showResponse(&#x27;请先接管任务，等交接完成后再编辑。&#x27;);return;}
      state.editor=true;response.hidden=true;
    }
    else if(name===&#x27;save&#x27;){
      const value=root.querySelector(&#x27;#f-edit-body&#x27;)?.value.trim();
      if(!value){showResponse(&#x27;正文不能为空，请填写后保存。&#x27;);return;}
      if(state.scene===&#x27;draft&#x27;){state.body=value;state.version++;state.confirmed=false;}else{state.taskBody=value;state.taskVersion++;}
      state.editor=false;
      showResponse(`已保存 v${state.scene===&#x27;draft&#x27;?state.version:state.taskVersion}，旧版本保留。可继续直接发送“导出”。`);
    }
    else if(name===&#x27;back&#x27;){state.editor=false;response.hidden=true;}
    else if(name===&#x27;discard&#x27;){state.discarded=true;showResponse(&#x27;已忽略，不会发布这份草稿。&#x27;);}
    else if(name===&#x27;restore-draft&#x27;){state.discarded=false;response.hidden=true;}
    else if(name===&#x27;export&#x27;){exportFile();}
    else if(name===&#x27;pause&#x27;){state.taskControl=&#x27;paused&#x27;;showResponse(&#x27;已暂停，进度保留。&#x27;);}
    else if(name===&#x27;resume&#x27;||name===&#x27;return&#x27;){state.taskControl=&#x27;agent&#x27;;showResponse(name===&#x27;return&#x27;?&#x27;已交还助手，将从当前产物继续。&#x27;:&#x27;已继续任务。&#x27;);}
    else if(name===&#x27;takeover&#x27;){
      if(state.taskControl===&#x27;handover&#x27;) return;
      state.taskControl=&#x27;handover&#x27;;showResponse(&#x27;正在移交，等待在途操作结束…\n可点击“刷新状态”查看演示交接结果。&#x27;);
    }
    else if(name===&#x27;refresh&#x27;){
      if(state.taskControl===&#x27;handover&#x27;){state.taskControl=&#x27;human&#x27;;showResponse(&#x27;移交完成，控制权已交给你。&#x27;);}
      else showResponse(&#x27;已显示当前状态。查看不会改变控制权。&#x27;);
    }
    else if(name===&#x27;artifact&#x27;){showResponse(`已保存产物 · v${state.taskVersion}\n\n${state.taskBody}`);}
    else if(name===&#x27;send-mail&#x27;){
      if(state.mailStatus!==&#x27;preview&#x27;) return;
      state.mailStatus=&#x27;submitted&#x27;;showResponse(&#x27;演示：本次发送已记录。本页面没有发送真实邮件。&#x27;);
    }
    else if(name===&#x27;cancel-mail&#x27;){state.mailStatus=&#x27;cancelled&#x27;;showResponse(&#x27;已取消本次预览对应的发送许可。&#x27;);}
    else if(name===&#x27;mail-preview&#x27;){state.mailStatus=&#x27;preview&#x27;;response.hidden=true;}
